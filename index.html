      if (!world.raycastClosest(_rf, _rt, { collisionFilterMask: GROUP.FLOOR | GROUP.OBST, skipBackfaces: true }, _rayRes)) break;
      const fade = 1 - d / (maxD + 0.5);
      _dotM.compose(_P.set(x, _rayRes.hitPointWorld.y + 0.02, z), _Q.identity(), _S.setScalar(0.5 + 0.7 * fade));
      aimDots.setMatrixAt(n++, _dotM);
    }
    aimDots.count = n;
    aimDots.instanceMatrix.needsUpdate = true;
  }
  UI.positionPowerLabel(_P.copy(ballMesh.position).add(_cv1.set(0, 1.05, 0)));
  // kinematic obstacles (interpolated between physics steps)
  for (const k of ctx.kinematics) {
    const bp = k.body.position, pp = k.prevPos;
    k.vis.position.set(lerp(pp.x, bp.x, alpha), lerp(pp.y, bp.y, alpha), lerp(pp.z, bp.z, alpha));
    _Q.set(k.prevQuat.x, k.prevQuat.y, k.prevQuat.z, k.prevQuat.w);
    k.vis.quaternion.set(k.body.quaternion.x, k.body.quaternion.y, k.body.quaternion.z, k.body.quaternion.w);
    k.vis.quaternion.copy(_Q.slerp(k.vis.quaternion, alpha));
  }
  // bumper squash + glow
  for (const bm of ctx.bumpers) {
    if (bm.hit > 0) {
      bm.hit = Math.max(0, bm.hit - dt);
      const w = Math.sin(bm.hit * 28) * bm.hit * 0.5;
      bm.vis.scale.set(1 + w, 1 - w, 1 + w);
      bm.vis.userData.capMat.emissiveIntensity = 0.9 + bm.hit * 3;
    }
  }
  // fade buildings / tunnels when the ball is inside them
  for (const fz of ctx.fades) {
    const inside = (st === 'ready' || st === 'rolling') && fz.region.contains(ballMesh.position.x, ballMesh.position.z);
    fz.cur = damp(fz.cur ?? 1, inside ? 1 - fz.amount * 0.85 : 1, 8, dt);
    for (const m of fz.mats) { m.opacity = fz.cur; m.depthWrite = fz.cur > 0.95; }
    if (fz.meshes) for (const m of fz.meshes) m.userData.faded = fz.cur < 0.9;
  }
  // cup light pillar fades when you are close
  const cd = Math.hypot(camera.position.x - ctx.cup.pos.x, camera.position.z - ctx.cup.pos.z);
  ctx.cup.pillarMat.uniforms.uAlpha.value = 0.4 * clamp((cd - 2) / 6, 0.12, 1);
  // themed animation
  for (const u of ctx.updaters) u(SHARED.time.value, dt);
  FX.update(dt);
  TRAIL.update(dt, ballMesh.position, st === 'rolling' && Math.hypot(ballBody.velocity.x - B.supportVel.x, ballBody.velocity.z - B.supportVel.z) > 0.6);
}

function render() {
  const useBloom = GAME.ctx && GAME.ctx.theme.bloom && GAME.save.settings.quality === 'high';
  if (useBloom) { ensureComposer(); composer.render(); }
  else renderer.render(scene, camera);
}

/* ---------- DEV helpers: collider wireframes (D / Shift+D) ---------- */
const DEBUG = { on: false, group: null };
const DEBUG_COLORS = { floor: '#00ff88', wall: '#ff3355', bumper: '#ff00ff', blade: '#ffaa00', spinner: '#ffaa00', raft: '#00ccff', ball: '#ffffff' };
function buildDebug() {
  clearDebug();
  DEBUG.group = new THREE.Group();
  for (const body of world.bodies) {
    const col = DEBUG_COLORS[body.userData && body.userData.kind] || '#ffff00';
    const mat = new THREE.LineBasicMaterial({ color: col, depthTest: false, transparent: true, opacity: 0.85 });
    body.shapes.forEach((s, i) => {
      let geo = null;
      if (s instanceof CANNON.Box) geo = new THREE.BoxGeometry(s.halfExtents.x * 2, s.halfExtents.y * 2, s.halfExtents.z * 2);
      else if (s instanceof CANNON.Sphere) geo = new THREE.SphereGeometry(s.radius, 12, 8);
      else if (s instanceof CANNON.Cylinder) geo = new THREE.CylinderGeometry(s.radiusTop, s.radiusBottom, s.height, 12);
      if (!geo) return;
      const m = new THREE.LineSegments(new THREE.EdgesGeometry(geo), mat);
      geo.dispose();
      m.userData = { body, off: body.shapeOffsets[i], ori: body.shapeOrientations[i] };
      m.renderOrder = 50;
      DEBUG.group.add(m);
    });
  }
  scene.add(DEBUG.group);
}
function clearDebug() {
  if (!DEBUG.group) return;
  scene.remove(DEBUG.group);
  DEBUG.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  DEBUG.group = null;
}
function syncDebug() {
  if (!DEBUG.group) return;
  for (const m of DEBUG.group.children) {
    const { body, off, ori } = m.userData;
    const w = body.quaternion.vmult(off);
    m.position.set(body.position.x + w.x, body.position.y + w.y, body.position.z + w.z);
    const q = body.quaternion.mult(ori);
    m.quaternion.set(q.x, q.y, q.z, q.w);
    m.visible = !!body.world;
  }
}
function toggleDebug() {
  DEBUG.on = !DEBUG.on;
  if (DEBUG.on) buildDebug(); else clearDebug();
  UI.toast(DEBUG.on ? 'Colliders ON' : 'Colliders OFF', '#ffffff');
}

/* ---------- main loop ---------- */
let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  SHARED.time.value += dt;
  if (!GAME.paused && GAME.ctx) {
    updateKeys(dt);
    updateCharge(dt);
    GAME.acc += dt;
    let n = 0;
    while (GAME.acc >= CONFIG.FIXED_DT && n < CONFIG.MAX_SUBSTEPS) { physicsStep(CONFIG.FIXED_DT); GAME.acc -= CONFIG.FIXED_DT; n++; }
    if (n >= CONFIG.MAX_SUBSTEPS) GAME.acc = 0;
    updateGame(dt);
  }
  syncVisuals(clamp(GAME.acc / CONFIG.FIXED_DT, 0, 1), GAME.paused ? 0 : dt);
  updateCamera(GAME.paused ? 0 : dt, ballMesh.position);
  skyDome.position.copy(camera.position);
  if (DEBUG.on) { if (!DEBUG.group && GAME.ctx) buildDebug(); syncDebug(); }
  render();
}

/* ---------- dev API (used for automated testing; harmless in play) ---------- */
window.golf = {
  CONFIG, HOLES,
  get state() { return GAME.state; },
  get strokes() { return GAME.strokes; },
  get ball() { const p = ballBody.position; return [p.x, p.y, p.z]; },
  get time() { return GAME.time; },
  load(i) { loadHole(i, {}); },
  // Take a real (rendered) shot: yaw in radians, power 0-100
  shoot(yaw, power) { CAM.yaw = yaw; if (canShoot()) shoot(power); },
  // Fast-forward a single shot without rendering. Returns where it ended up.
  sim({ from, yaw, power, t0, maxTime = 30, trace = false }) {
    const ctx = GAME.ctx;
    GAME.timers = []; GAME.sink = null; GAME.hazardAnim = null;
    GAME.time = t0 ?? 0; resetKinematics(GAME.time);
    const start = from ? new V3(...from) : new V3(ctx.hole.tee[0], ctx.hole.tee[1] + BR + 0.002, ctx.hole.tee[2]);
    placeBall(start);
    for (let i = 0; i < 30; i++) physicsStep(CONFIG.FIXED_DT);   // settle onto the ground / raft
    GAME.simulating = true; GAME.state = 'ready'; GAME.strokes = 0; GAME.lastHazard = null;
    CAM.yaw = yaw;
    shoot(power);
    let t = 0, n = 0;
    const path = trace ? [] : null;
    while (t < maxTime && GAME.state === 'rolling') {
      physicsStep(CONFIG.FIXED_DT); t += CONFIG.FIXED_DT;
      if (path && (n++ % 12 === 0)) { const q = ballBody.position, w = ballBody.velocity; path.push([+q.x.toFixed(2), +q.y.toFixed(2), +q.z.toFixed(2), +Math.hypot(w.x, w.z).toFixed(2)]); }
    }
    const p = ballBody.position;
    const res = { result: GAME.state === 'sinking' ? 'holed' : GAME.state === 'hazard' ? 'hazard:' + GAME.lastHazard : GAME.state === 'ready' ? 'stopped' : 'timeout', pos: [p.x, p.y, p.z], t, gameTime: GAME.time, onStatic: !!(GAME.ball.support && GAME.ball.support.type === CANNON.Body.STATIC), path };
    GAME.simulating = false;
    placeBall(start); GAME.state = 'ready'; GAME.strokes = 0;
    return res;
  },
};

/* ---------- boot ---------- */
async function boot() {
  UI.init();
  applySettings({});
  try {
    await Promise.race([document.fonts.load("64px 'Lilita One'"), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* fall back to system fonts */ }
  youSprite.material.map.dispose();
  youSprite.material.map = makeYouTexture();
  youSprite.material.needsUpdate = true;
  window.__golfBooted = true;
  $('loading').classList.add('hidden');
  $('loadError').classList.add('hidden');   // in case the slow-network watchdog fired first
  const q = parseInt(new URLSearchParams(location.search).get('hole'), 10);
  if (q >= 1 && q <= HOLES.length) {
    GAME.round = { scores: Array(HOLES.length).fill(null), start: q - 1, newBests: [] };
    loadHole(q - 1, {});
  } else {
    loadHole(0, { title: true });
    UI.title();
  }
  requestAnimationFrame(frame);
}
boot();
