<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f8ff0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hole-y Moly! Mini Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --ink: #24123a;
    --outline: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink),
               2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink),
               0 6px 0 rgba(0,0,0,.28);
    --bar-h: 34px;
    --gutter: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1220;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: var(--font); color: #fff;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  #ui button { font-family: var(--font); cursor: pointer; pointer-events: auto; touch-action: none; }
  .hidden { display: none !important; }
  .outlined { text-shadow: var(--outline); }

  /* ---------- HUD ---------- */
  #hud { position: absolute; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 12px); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pill {
    background: rgba(14, 24, 40, .74); border: 2px solid rgba(255,255,255,.14);
    color: #7ff6e4; border-radius: 999px; padding: 5px 16px 6px; font-size: clamp(17px, 4.4vw, 23px);
    letter-spacing: .5px; text-shadow: 0 2px 0 rgba(0,0,0,.45); box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .pill b { color: #fff; font-weight: normal; }
  .pill.bump { animation: pillBump .35s ease-out; }
  @keyframes pillBump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  #topRight { position: absolute; top: calc(var(--sat) + 12px); right: calc(var(--sar) + 12px); display: flex; gap: 10px; }
  .iconBtn {
    width: 52px; height: 52px; border-radius: 16px; border: 3px solid #fff; background: rgba(14,24,40,.7);
    display: grid; place-items: center; padding: 0; box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  .iconBtn svg { width: 24px; height: 24px; fill: #fff; }
  .iconBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  /* ---------- Controls ---------- */
  #powerWrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--sab) + 16px); width: min(600px, calc(100% - 2 * (var(--gutter) + 118px))); height: var(--bar-h);
  }
  #powerTrack {
    position: absolute; inset: 0; border-radius: 999px; background: #fdfdfd;
    box-shadow: 0 0 0 3px rgba(20,20,40,.35), 0 6px 14px rgba(0,0,0,.3); overflow: hidden;
  }
  #powerFill {
    position: absolute; inset: 0; border-radius: 999px;
    background: linear-gradient(90deg, #5fdc3c 0%, #a6e22a 22%, #e8e021 45%, #ffbf1f 65%, #ff8f1c 85%, #ff5a1a 100%);
    clip-path: inset(0 100% 0 0 round 999px);
  }
  .tick { position: absolute; width: 4px; border-radius: 2px; background: #fff; transform: translateX(-50%); }
  .tick.t { top: -7px; height: 12px; } .tick.b { bottom: -7px; height: 12px; }
  #powerTicks .tick { box-shadow: 0 0 0 1px rgba(40,40,60,.25); }
  #powerTicks { position: absolute; inset: 0; pointer-events: none; }
  #powerBadge {
    position: absolute; top: 50%; left: 0%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: #ff9a1f; border: 4px solid #fff; display: grid; place-items: center; font-size: 22px; color: #fff;
    text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
    box-shadow: 0 4px 8px rgba(0,0,0,.3); transition: transform .08s;
  }
  #shootBtn {
    position: absolute; right: calc(var(--sar) + var(--gutter)); bottom: calc(var(--sab) + 12px);
    width: 104px; height: 104px; border-radius: 50%; border: 5px solid #fff; padding: 0;
    background: radial-gradient(circle at 50% 35%, #ffe680 0%, #ffc21a 55%, #ff9d00 100%);
    color: #fff; font-size: 24px; letter-spacing: .5px; text-shadow: var(--outline);
    box-shadow: 0 7px 0 #c46b00, 0 12px 20px rgba(0,0,0,.35);
  }
  #shootBtn.pressed { transform: translateY(5px) scale(.96); box-shadow: 0 2px 0 #c46b00, 0 6px 12px rgba(0,0,0,.3); }
  #shootBtn.busy { filter: grayscale(.7) brightness(.9); opacity: .7; }
  #resetBtn {
    position: absolute; left: calc(var(--sal) + var(--gutter)); bottom: calc(var(--sab) + 22px);
    width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; padding: 0;
    background: rgba(14,24,40,.72); display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.3);
  }
  #resetBtn svg { width: 30px; height: 30px; fill: #fff; }
  #resetBtn:active { transform: translateY(3px); }

  /* Portrait: power bar spans the bottom like the reference screenshots, buttons sit above it */
  @media (max-aspect-ratio: 1/1) {
    #powerWrap { width: calc(100% - 2 * var(--gutter)); bottom: calc(var(--sab) + 14px); }
    #shootBtn { bottom: calc(var(--sab) + 14px + var(--bar-h) + 22px); }
    #resetBtn { bottom: calc(var(--sab) + 14px + var(--bar-h) + 34px); }
    #hint { top: calc(var(--sat) + 150px); }
  }

  #powerLabel {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-size: 26px; color: #fff;
    text-shadow: var(--outline); white-space: nowrap; will-change: transform;
  }

  /* ---------- Banners, popups ---------- */
  #holeBanner {
    position: absolute; left: 50%; top: calc(var(--sat) + 18%); transform: translateX(-50%); text-align: center;
    pointer-events: none; animation: bannerIn .6s cubic-bezier(.2,1.6,.4,1) both;
  }
  #holeBanner .num { font-size: clamp(22px, 6vw, 34px); color: #7ff6e4; text-shadow: var(--outline); }
  #holeBanner .name { font-size: clamp(38px, 11vw, 72px); color: #ffd23f; text-shadow: var(--outline); line-height: 1; }
  #holeBanner .par { font-size: clamp(20px, 5vw, 28px); color: #fff; text-shadow: var(--outline); margin-top: 6px; }
  @keyframes bannerIn { from { opacity: 0; transform: translate(-50%, -30px) scale(.6); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  #skipHint {
    position: absolute; left: 50%; bottom: calc(var(--sab) + 28px); transform: translateX(-50%);
    font-size: 20px; color: #fff; text-shadow: var(--outline); opacity: .85; animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  #hint {
    position: absolute; left: 50%; top: calc(var(--sat) + 74px); transform: translateX(-50%); width: max-content; max-width: 90%;
    background: rgba(14,24,40,.72); border: 2px solid rgba(255,255,255,.2); border-radius: 18px; padding: 8px 18px;
    font-size: clamp(15px, 4vw, 20px); text-align: center; line-height: 1.3; text-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  #hint b { color: #ffd23f; font-weight: normal; }
  #toast {
    position: absolute; left: 50%; top: calc(var(--sat) + 34%); transform: translate(-50%, 0); font-size: clamp(26px, 7vw, 42px);
    color: #8fe8ff; text-shadow: var(--outline); opacity: 0; white-space: nowrap; pointer-events: none;
  }
  #toast.show { animation: toastAnim 1.6s ease-out both; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    25% { transform: translate(-50%, 0) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -24px) scale(1); }
  }
  #popup {
    position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none;
    font-size: clamp(54px, 15vw, 128px); line-height: .95; color: #ffd23f; opacity: 0;
  }
  #popup .sub { display: block; font-size: .3em; color: #fff; margin-top: .25em; }
  #popup.show { animation: popIn .9s cubic-bezier(.17,.89,.32,1.28) both; }
  #popup.hide { animation: popOut .35s ease-in both; }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(.15) rotate(-10deg); }
    55% { opacity: 1; transform: scale(1.2) rotate(4deg); }
    72% { transform: scale(.92) rotate(-2deg); }
    86% { transform: scale(1.05) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes popOut { to { opacity: 0; transform: scale(1.4); } }
  #fade { position: absolute; inset: 0; background: #0b1220; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #fade.on { opacity: 1; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto;
    padding: calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
    overflow-y: auto; touch-action: pan-y;
  }
  .overlay.dim { background: rgba(10, 14, 30, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .panel {
    background: linear-gradient(#ffffff, #eef6ff); color: var(--ink); border-radius: 28px; border: 5px solid #fff;
    box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 20px 50px rgba(0,0,0,.35); padding: 22px 22px 24px; width: min(440px, 100%);
    text-align: center; margin: auto;
  }
  .panel h2 { margin: 0 0 14px; font-size: 38px; font-weight: normal; color: #ffd23f; text-shadow: var(--outline); }
  .btnCol { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .btn {
    min-height: 54px; border: none; border-radius: 18px; padding: 10px 26px 12px; font-size: 24px; color: #fff;
    background: #ffc21a; box-shadow: 0 6px 0 #c97f00; text-shadow: var(--outline); letter-spacing: .5px;
  }
  .btn.blue { background: #3fb6ff; box-shadow: 0 6px 0 #1f78c4; }
  .btn.green { background: #4fd36a; box-shadow: 0 6px 0 #2a9442; }
  .btn.pink { background: #ff5fa8; box-shadow: 0 6px 0 #c22f73; }
  .btn.gray { background: #8b97ad; box-shadow: 0 6px 0 #5d677c; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  #titleScreen { flex-direction: column; gap: 10px; background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0) 30%, rgba(10,30,60,.35) 100%); }
  #titleLogo { text-align: center; margin-bottom: 8px; }
  #titleLogo .l1 { display: block; font-size: clamp(64px, 19vw, 150px); line-height: .9; color: #ffd23f; }
  #titleLogo .l2 { display: block; font-size: clamp(30px, 8vw, 62px); color: #ff5fa8; margin-top: 6px; }
  #titleLogo .tag { display: block; font-size: clamp(16px, 4.2vw, 22px); color: #fff; margin-top: 10px; }
  #titleLogo .ch { display: inline-block; animation: wobble 2.4s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-3deg); } 50% { transform: translateY(0) rotate(2deg); } }
  #titleButtons { display: flex; flex-direction: column; gap: 14px; width: min(320px, 86vw); }
  #titleButtons .btn { font-size: 28px; min-height: 62px; }
  #titleBest { font-size: 20px; color: #fff; text-shadow: var(--outline); margin-top: 8px; min-height: 24px; }

  .holeGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .holeCell {
    border: none; border-radius: 18px; padding: 10px 4px; min-height: 84px; color: #fff; text-shadow: var(--outline);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 26px;
  }
  .holeCell small { font-size: 14px; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .holeCell.meadow { background: #4fc96a; box-shadow: 0 5px 0 #2f8f45; }
  .holeCell.reef { background: #2fb7c9; box-shadow: 0 5px 0 #1b7f8f; }
  .holeCell.neon { background: #9a4dff; box-shadow: 0 5px 0 #6127b8; }
  .holeCell:active { transform: translateY(3px); }

  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; font-size: 22px; }
  .seg { display: flex; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .seg button { border: none; min-width: 72px; min-height: 48px; font-size: 20px; background: #dfe7f3; color: var(--ink); }
  .seg button.on { background: #3fb6ff; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  input[type=range] { width: 160px; height: 48px; accent-color: #3fb6ff; pointer-events: auto; touch-action: none; }

  #scoreTable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 19px; margin-bottom: 16px; }
  #scoreTable th { font-weight: normal; color: #6a7590; font-size: 15px; }
  #scoreTable td { background: #e6eefb; padding: 6px 4px; }
  #scoreTable td:first-child { border-radius: 10px 0 0 10px; } #scoreTable td:last-child { border-radius: 0 10px 10px 0; }
  #scoreTable tr.best td { background: #fff1b8; }
  #scoreTable tr.total td { background: #24123a; color: #ffd23f; font-size: 22px; }
  .under { color: #18a34a; } .over { color: #d6336c; } .even { color: #6a7590; }
  .newBest { display: inline-block; background: #ff5fa8; color: #fff; border-radius: 8px; padding: 0 6px; font-size: 13px; margin-left: 4px; vertical-align: 2px; }
  #scoreHeadline { font-size: 24px; margin: -4px 0 12px; color: var(--ink); }

  /* Short screens (phones in landscape): shrink the logo/menus, keep the hint clear of the HUD */
  @media (max-height: 520px) {
    .overlay { justify-content: safe center; }
    #titleScreen { flex-direction: row; flex-wrap: wrap; align-content: center; gap: 4px 28px; }
    #titleLogo { margin: 0; }
    #titleLogo .l1 { font-size: clamp(40px, 15vh, 110px); }
    #titleLogo .l2 { font-size: clamp(20px, 8vh, 44px); margin-top: 2px; }
    #titleLogo .tag { display: none; }
    #titleButtons { gap: 10px; width: min(280px, 40vw); }
    #titleButtons .btn { min-height: 52px; font-size: 22px; }
    #titleBest { width: 100%; text-align: center; }
    .pill { font-size: 16px; padding: 3px 12px 4px; }
    #hud { gap: 4px; }
    #hint { top: calc(var(--sat) + 12px); max-width: calc(100% - 330px); font-size: 14px; padding: 6px 12px; }
    .panel { padding: 14px 16px 16px; }
    .panel h2 { font-size: 30px; margin-bottom: 8px; }
    .btnCol { gap: 8px; }
    .btn { min-height: 48px; font-size: 20px; padding: 8px 20px 10px; }
    .holeCell { min-height: 60px; padding: 6px 4px; font-size: 22px; }
    #scoreTable { font-size: 15px; }
  }
  #loading { flex-direction: column; background: #0b1220; font-size: 28px; color: #ffd23f; text-shadow: var(--outline); }
  #loading .spin { width: 54px; height: 54px; border-radius: 50%; border: 7px solid #fff; border-top-color: #ffd23f; animation: spin .8s linear infinite; margin-bottom: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadError { background: #0b1220; }
  #loadError .panel { font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="pill" id="hudHole">Hole <b>1</b></div>
    <div class="pill" id="hudPar">Par <b>2</b></div>
    <div class="pill" id="hudStrokes">Strokes <b>0</b></div>
  </div>
  <div id="topRight" class="hidden">
    <button class="iconBtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
    </button>
  </div>
  <div id="hint" class="hidden"></div>
  <div id="powerLabel" class="hidden">Power: 0</div>
  <div id="controls" class="hidden">
    <button id="resetBtn" aria-label="Reset ball to last spot">
      <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.75 10h2.1A6 6 0 1 0 12 6v3L7.5 5 12 1v3z"/></svg>
    </button>
    <div id="powerWrap">
      <div id="powerTrack"><div id="powerFill"></div></div>
      <div id="powerTicks">
        <div class="tick t" style="left:25%"></div><div class="tick b" style="left:25%"></div>
        <div class="tick t" style="left:50%"></div><div class="tick b" style="left:50%"></div>
        <div class="tick t" style="left:75%"></div><div class="tick b" style="left:75%"></div>
      </div>
      <div id="powerBadge">0</div>
    </div>
    <button id="shootBtn" aria-label="Hold to charge, release to shoot">SHOOT</button>
  </div>
  <div id="holeBanner" class="hidden"></div>
  <div id="skipHint" class="hidden">Tap to skip</div>
  <div id="toast"></div>
  <div id="popup"></div>

  <div id="titleScreen" class="overlay hidden">
    <div id="titleLogo" class="outlined"></div>
    <div id="titleButtons">
      <button class="btn green" id="playBtn">PLAY</button>
      <button class="btn blue" id="titleHolesBtn">Hole Select</button>
      <button class="btn gray" id="titleSettingsBtn">Settings</button>
    </div>
    <div id="titleBest"></div>
  </div>

  <div id="pauseMenu" class="overlay dim hidden">
    <div class="panel">
      <h2>Paused</h2>
      <div class="btnCol">
        <button class="btn green" id="resumeBtn">Resume</button>
        <button class="btn" id="restartBtn">Restart Hole</button>
        <button class="btn blue" id="pauseHolesBtn">Hole Select</button>
        <button class="btn gray" id="pauseSettingsBtn">Settings</button>
        <button class="btn pink" id="quitBtn">Quit to Title</button>
      </div>
    </div>
  </div>

  <div id="holeSelect" class="overlay dim hidden">
    <div class="panel">
      <h2>Holes</h2>
      <div class="holeGrid" id="holeGrid"></div>
      <button class="btn gray" id="holesBackBtn">Back</button>
    </div>
  </div>

  <div id="settingsMenu" class="overlay dim hidden">
    <div class="panel">
      <h2>Settings</h2>
      <div class="setRow"><span>Sound</span><div class="seg" id="segSound"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
      <div class="setRow"><span>Quality</span><div class="seg" id="segQuality"><button data-v="low">Low</button><button data-v="high">High</button></div></div>
      <div class="setRow"><span>Aim speed</span><input type="range" id="sensRange" min="0.3" max="2" step="0.05" aria-label="Aim sensitivity"></div>
      <button class="btn gray" id="settingsBackBtn" style="margin-top:8px">Back</button>
    </div>
  </div>

  <div id="scorecard" class="overlay dim hidden">
    <div class="panel">
      <h2>Scorecard</h2>
      <div id="scoreHeadline"></div>
      <table id="scoreTable"></table>
      <div class="btnCol">
        <button class="btn green" id="againBtn">Play Again</button>
        <button class="btn gray" id="scoreTitleBtn">Title</button>
      </div>
    </div>
  </div>

  <div id="loading" class="overlay"><div class="spin"></div>Loading…</div>
  <div id="loadError" class="overlay hidden">
    <div class="panel">
      <h2>Oops!</h2>
      <p id="loadErrorMsg">The 3D libraries could not be loaded. Check your internet connection and reload the page.</p>
    </div>
  </div>
  <div id="fade"></div>
</div>

<script>
  // Loading watchdog (classic script): if the ES modules never boot, explain why instead of a blank screen.
  window.__golfBooted = false;
  window.addEventListener('error', function (e) {
    if (window.__golfBooted) return;
    var t = e && e.target;
    if (t && t.tagName === 'SCRIPT') {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('loadError').classList.remove('hidden');
    }
  }, true);
  setTimeout(function () {
    if (!window.__golfBooted) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('loadError').classList.remove('hidden');
    }
  }, 20000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================

const TEX = {};

    const fx = (x / S) * cells, fy = (y / S) * cells;
    const ix = Math.floor(fx), iy = Math.floor(fy);

      img.data[i * 4 + 1] = big[i] * 255;
      img.data[i * 4 + 2] = med[i] * 255;

    const rows = 18;
    for (let r = 0; r < rows; r++) {

      const count = Math.max(4, Math.round(36 * Math.cos(lat)));
      const y = ((r + 0.5) / rows) * H;

/* ---------- Shader-patched materials ---------- */
const CAUSTICS_GLSL = /* glsl */`
  float causticsPattern(vec2 uv, float time) {
    vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
    vec2 i = p; float c = 1.0; float inten = 0.005;
    for (int n = 0; n < 4; n++) {
      float t = time * (1.0 - (3.5 / float(n + 1)));
      i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
      c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
    }
    c /= 4.0; c = 1.17 - pow(c, 1.4);
    return clamp(pow(abs(c), 8.0), 0.0, 1.0);
  }`;

// World-space checkerboard "mowed grass" (also used for sand and ground by setting a huge checker size)
function makeSurfaceMaterial(opts) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: opts.roughness ?? 0.95, metalness: 0 });
  const uniforms = {
    uColA: { value: new THREE.Color(opts.a) }, uColB: { value: new THREE.Color(opts.b ?? opts.a) },
    uChecker: { value: opts.checker ?? CONFIG.CHECKER_SIZE }, uNoise: { value: TEX.noise },
    uGrain: { value: opts.grain ?? 0.5 }, uPatch: { value: opts.patch ?? 0.2 }, uGrainScale: { value: opts.grainScale ?? 0.23 },
    uTime: SHARED.time, uCaustics: { value: opts.caustics ?? 0 }, uCausticCol: { value: new THREE.Color(opts.causticColor ?? '#c8fff4') },
    uSpeckCol: { value: new THREE.Color(opts.speck ?? '#000000') }, uSpeck: { value: opts.speck ? 1 : 0 },
  };
  mat.userData.uniforms = uniforms;
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        uniform vec3 uColA, uColB, uCausticCol, uSpeckCol; uniform float uChecker, uGrain, uPatch, uGrainScale, uTime, uCaustics, uSpeck;
        uniform sampler2D uNoise;
        ${CAUSTICS_GLSL}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 cc = floor(vWPos.xz / uChecker);
        float chk = mod(cc.x + cc.y, 2.0);
        vec3 gcol = mix(uColA, uColB, chk);
        vec4 nz = texture2D(uNoise, vWPos.xz * uGrainScale);
        vec4 nzb = texture2D(uNoise, vWPos.xz * 0.025 + 0.31);
        gcol *= (1.0 - uGrain * 0.5) + uGrain * nz.r;
        gcol *= (1.0 - uPatch * 0.5) + uPatch * nzb.g;
        float sp = smoothstep(0.86, 0.96, texture2D(uNoise, vWPos.xz * 0.11 + 0.5).b) * uSpeck;
        gcol = mix(gcol, uSpeckCol, sp);
        diffuseColor.rgb *= gcol;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if (uCaustics > 0.0) totalEmissiveRadiance += uCausticCol * causticsPattern(vWPos.xz * 0.09, uTime * 0.55) * uCaustics;
        if (uSpeck > 0.0) totalEmissiveRadiance += uSpeckCol * sp * 0.8;`);
  };
  mat.customProgramCacheKey = () => 'surface-v1';   // same shader code for every instance; values come from uniforms
  return mat;
}

// Water / goo: animated, slightly transparent liquid
function makeLiquidMaterial({ color, deep, emissive = '#000000', emissiveAmt = 0, opacity = 0.88, goo = false }) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.12, metalness: 0.05, transparent: opacity < 1, opacity, depthWrite: true });
  const uniforms = {
    uCol: { value: new THREE.Color(color) }, uDeep: { value: new THREE.Color(deep) }, uTime: SHARED.time,
    uEm: { value: new THREE.Color(emissive) }, uEmAmt: { value: emissiveAmt }, uGoo: { value: goo ? 1 : 0 }, uNoise: { value: TEX.noise },
  };
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; uniform vec3 uCol, uDeep, uEm; uniform float uTime, uEmAmt, uGoo; uniform sampler2D uNoise;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 q = vWPos.xz;
        float n1 = texture2D(uNoise, q * 0.08 + vec2(uTime * 0.02, uTime * 0.013)).b;
        float n2 = texture2D(uNoise, q * 0.13 - vec2(uTime * 0.017, -uTime * 0.021)).b;
        float rip = smoothstep(0.48, 0.5, abs(fract((n1 + n2) * 3.0) - 0.5));
        vec3 lcol = mix(uDeep, uCol, n1 * 0.7 + 0.3);
        lcol = mix(lcol, vec3(1.0), rip * (0.35 - uGoo * 0.2));
        if (uGoo > 0.5) {
          float bub = smoothstep(0.82, 0.9, texture2D(uNoise, q * 0.35 + vec2(0.0, uTime * 0.05)).b);
          lcol = mix(lcol, uCol * 1.6, bub);
        }
        diffuseColor.rgb *= lcol;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += uEm * uEmAmt * (0.75 + 0.5 * n2);`);
  };
  mat.customProgramCacheKey = () => 'liquid-v1';
  mat.polygonOffset = true; mat.polygonOffsetFactor = -2; mat.polygonOffsetUnits = -2;
  return mat;
}

// Swaying instanced foliage (seaweed, glowing plants): bends with height and time
function addSway(mat, amount = 0.35, speed = 1.4) {
  const uniforms = { uTime: SHARED.time, uSway: { value: amount }, uSwaySpeed: { value: speed } };
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime, uSway, uSwaySpeed;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          float ph = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.61;
        #else
          float ph = 0.0;
        #endif
        float hgt = max(position.y, 0.0);
        transformed.x += sin(uTime * uSwaySpeed + ph) * uSway * hgt * hgt * 0.35;
        transformed.z += cos(uTime * uSwaySpeed * 0.8 + ph * 1.3) * uSway * hgt * hgt * 0.2;`);
  };
  mat.customProgramCacheKey = () => 'sway-v1';
  return mat;
}

// Lighten top-facing vertices: gives rails and blocks a lighter "cap" like the reference art
function tintByNormal(geo, topHex, sideHex, threshold = 0.6) {
  const n = geo.attributes.normal, cnt = n.count;
  const top = new THREE.Color(topHex), side = new THREE.Color(sideHex);
  const col = new Float32Array(cnt * 3);
  for (let i = 0; i < cnt; i++) {
    const c = n.getY(i) > threshold ? top : side;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

// Canvas text texture with chunky outline
function textTexture(text, { w = 512, h = 256, size = 120, color = '#ffffff', stroke = '#24123a', strokeW = 16, bg = null, font = null } = {}) {
  const [c, g] = makeCanvas(w, h);
  if (bg) bg(g, w, h);
  g.font = `${size}px ${font || "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif"}`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = strokeW; g.strokeStyle = stroke;
  if (strokeW > 0) g.strokeText(text, w / 2, h / 2 + size * 0.04);
  g.fillStyle = color; g.fillText(text, w / 2, h / 2 + size * 0.04);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// Geometry helpers ----------------------------------------------------
function pushQuad(arr, p0, p1, p2, p3, n, uv = [[0, 1], [1, 1], [1, 0], [0, 0]]) {
  // p0 top-left, p1 top-right, p2 bottom-right, p3 bottom-left; winding fixed to face n
  _v1.subVectors(p1, p0); _v2.subVectors(p2, p0); _v3.crossVectors(_v1, _v2);

  const P = [p0, p1, p2, p3];
  for (const t of tris) for (const k of t) {
    arr.pos.push(P[k].x, P[k].y, P[k].z); arr.nor.push(n.x, n.y, n.z); arr.uv.push(uv[k][0], uv[k][1]);
  }

function newArr() { return { pos: [], nor: [], uv: [] }; }
function arrToGeo(arr) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(arr.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(arr.nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(arr.uv, 2));

}
function mergeAll(geos) {
  if (!geos.length) return null;
  const list = geos.map(g => {
    let h = g.index ? g.toNonIndexed() : g;
    for (const k of Object.keys(h.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) h.deleteAttribute(k);
    return h;

  const hasColor = list.some(g => g.attributes.color);
  if (hasColor) list.forEach(g => { if (!g.attributes.color) tintByNormal(g, '#ffffff', '#ffffff'); });

function subtractInterval(iv, a, b) {

function trackY(ctx, y) { ctx.minY = Math.min(ctx.minY, y); ctx.maxY = Math.max(ctx.maxY, y); }
function addFootprint(ctx, b, m = 0.4) { ctx.footprint.push({ minX: b.minX - m, maxX: b.maxX + m, minZ: b.minZ - m, maxZ: b.maxZ + m }); }

// Skirt: vertical sides of a raised fairway, down to the theme's base ground
function buildSkirt(pts, yTop, yBot, arr) {
  const sign = signedArea(pts) > 0 ? 1 : -1;
  let u = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz);
    const nout = new V3(dz / L * sign, 0, -dx / L * sign);
    const h = (yTop - yBot) / 2;
    pushQuad(arr, new V3(a[0], yTop, a[1]), new V3(b[0], yTop, b[1]), new V3(b[0], yBot, b[1]), new V3(a[0], yBot, a[1]), nout,
      [[u, 1], [u + L / 2, 1], [u + L / 2, 1 - h], [u, 1 - h]]);

// One straight rail: inner face from P0 to P1, extending outward along `out`, standing along `up`.
function addRailSegment(ctx, P0, P1, out, ext = [0, 0], extC = [0, 0]) {
  const T = CONFIG.RAIL_THICK, H = CONFIG.RAIL_HEIGHT, Tc = CONFIG.RAIL_COLLIDER_THICK, Hc = CONFIG.RAIL_COLLIDER_HEIGHT;
  const Z = out.clone().normalize();
  const X = new V3().subVectors(P1, P0);
  // keep a right-handed basis with "up" pointing up: walk the segment the other way if needed
  if (new V3().crossVectors(Z, X).y < 0) { [P0, P1] = [P1, P0]; ext = [ext[1], ext[0]]; extC = [extC[1], extC[0]]; X.negate(); }

  const g = new RoundedBoxGeometry(vLen, H, T, 2, 0.09);
  _m4.compose(vMid.clone().addScaledVector(Y, H / 2).addScaledVector(Z, T / 2), _q, new V3(1, 1, 1));

function addPost(ctx, x, y, z, r = CONFIG.RAIL_THICK / 2 + 0.04) {
  const H = CONFIG.RAIL_HEIGHT + 0.1, Hc = CONFIG.RAIL_COLLIDER_HEIGHT;
  const g = new THREE.CylinderGeometry(r * 0.92, r, H, 14, 1);
  g.translate(x, y + H / 2, z);
  ctx.railGeos.push(g);
  const cap = new THREE.SphereGeometry(r * 0.92, 14, 6, 0, TAU, 0, Math.PI / 2);
  cap.scale(1, 0.45, 1); cap.translate(x, y + H, z);

// Rails around a fairway polygon (inside auto-detected), skipping `open` segments
function buildRails(pts, y, ctx, openSegs) {
  const n = pts.length, sign = signedArea(pts) > 0 ? 1 : -1;

    const d = [dx / L, dz / L];

      if (Math.abs(off(s[0], s[1])) > 0.05 || Math.abs(off(s[2], s[3])) > 0.05) continue;

        if (c && c.concave) { ext[0] = T * c.tan; extC[0] = Tc * c.tan; } else if (!c) endPost(e, s);
      } else endPost(e, s);
      if (k === e.iv.length - 1 && t > e.L - 1e-3) {
        const c = corner((i + 1) % n);
        if (c && c.concave) { ext[1] = T * c.tan; extC[1] = Tc * c.tan; } else if (!c) endPost(e, t);
      } else endPost(e, t);
      addRailSegment(ctx, P(e, s), P(e, t), new V3(e.nout[0], 0, e.nout[1]), ext, extC);
    });
  }
  // chunky posts on real corners, centred where the two rail centre-lines meet
  for (let i = 0; i < n; i++) {
    const c = corner(i);
    if (!c || c.phi < 0.3) continue;
    const n1 = c.e1.nout, n2 = c.e2.nout, den = 1 + n1[0] * n2[0] + n1[1] * n2[1];
    if (den < 0.25) continue;
    const v = pts[i];
    addPost(ctx, v[0] + (n1[0] + n2[0]) * (T / 2) / den, y, v[1] + (n1[1] + n2[1]) * (T / 2) / den);
  }
}

const BUILDERS = {};

// Fairway: polygon surface (visual) + box colliders + automatic rails
BUILDERS.fairway = (p, ctx) => {
  const y = p.y ?? 0, pts = p.pts;
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const top = flatShapeGeometry(shape, y, 1);
  const b = polyBounds(pts);
  if (p.surface === 'plank') {
    const uv = top.attributes.uv;   // shape UVs are world units: 2 units per plank texture
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.5, uv.getY(i) * 0.5);
    ctx.plankGeos.push(top);
  } else ctx.grassGeos.push(top);
  if (p.skirt === 'bridge') {
    // a thin deck edge instead of a solid cliff, held up by poles from the sea floor
    buildSkirt(pts, y, y - 0.22, ctx.skirtArr);
    const poleMat = new THREE.MeshStandardMaterial({ color: '#5e4032', roughness: 1 });
    const len = y - 0.22 - ctx.theme.groundY;
    for (let z = b.minZ + 0.4; z <= b.maxZ - 0.3; z += 2.6) {
      for (const x of [b.minX + 0.12, b.maxX - 0.12]) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, len, 8), poleMat);
        pole.position.set(x, ctx.theme.groundY + len / 2, z); pole.castShadow = true;
        ctx.group.add(pole);
      }
    }
  } else buildSkirt(pts, y, ctx.theme.groundY, ctx.skirtArr);
  const D = CONFIG.FLOOR_COLLIDER_DEPTH;
  for (const [x0, z0, x1, z1] of p.cols || [[b.minX, b.minZ, b.maxX, b.maxZ]]) {
    addBox(ctx.floorBody, (x1 - x0) / 2, D / 2, (z1 - z0) / 2, new V3((x0 + x1) / 2, y - D / 2, (z0 + z1) / 2));
  }
  if (p.rails !== false) buildRails(pts, y, ctx, p.open || []);
  addFootprint(ctx, b);
  trackY(ctx, y);
};

// Ramp: sloped strip from `from` [x,y,z] to `to` [x,y,z]
BUILDERS.ramp = (p, ctx) => {
  const A = new V3(...p.from), B = new V3(...p.to);
  const along = new V3().subVectors(B, A); const L = along.length(); along.normalize();
  const nrm = new V3(0, 1, 0).addScaledVector(along, -along.y).normalize();
  const side = new V3().crossVectors(nrm, along).normalize();
  const hw = p.w / 2;
  const a0 = A.clone().addScaledVector(side, -hw), a1 = A.clone().addScaledVector(side, hw);
  const b0 = B.clone().addScaledVector(side, -hw), b1 = B.clone().addScaledVector(side, hw);
  const top = newArr(); pushQuad(top, a0, a1, b1, b0, nrm); ctx.grassGeos.push(arrToGeo(top));
  const gy = ctx.theme.groundY;
  for (const [p0, p1, s] of [[a0, b0, -1], [a1, b1, 1]]) {
    pushQuad(ctx.skirtArr, p0, p1, new V3(p1.x, gy, p1.z), new V3(p0.x, gy, p0.z), side.clone().multiplyScalar(s),
      [[0, 1], [L / 2, 1], [L / 2, 1 - (p1.y - gy) / 2], [0, 1 - (p0.y - gy) / 2]]);
  }
  // collider: one box whose top face is the ramp surface; dips under the lower floor to avoid a seam
  const ov = CONFIG.RAMP_OVERLAP, D = CONFIG.FLOOR_COLLIDER_DEPTH;
  const lowIsA = A.y <= B.y;
  const A2 = lowIsA ? A.clone().addScaledVector(along, -ov) : A.clone();
  const B2 = lowIsA ? B.clone() : B.clone().addScaledVector(along, ov);
  const mid = A2.clone().add(B2).multiplyScalar(0.5).addScaledVector(nrm, -D / 2);
  _q.setFromRotationMatrix(_m4.makeBasis(side, nrm, along));
  addBox(ctx.floorBody, hw + 0.6, D / 2, A2.distanceTo(B2) / 2, mid, _q);
  if (p.rails !== false) {
    for (const s of [-1, 1]) {
      const P0 = A.clone().addScaledVector(side, s * hw), P1 = B.clone().addScaledVector(side, s * hw);
      addRailSegment(ctx, P0, P1, side.clone().multiplyScalar(s), [0.12, 0.12], [0.3, 0.3]);
    }
  }
  addFootprint(ctx, polyBounds([[a0.x, a0.z], [a1.x, a1.z], [b0.x, b0.z], [b1.x, b1.z]]));
  trackY(ctx, A.y); trackY(ctx, B.y);
};

// Solid rounded block obstacle
BUILDERS.block = (p, ctx) => {
  const y = p.y ?? 0, h = p.h ?? 0.6;

  body.position.set(p.x, y, p.z); body.quaternion.set(_q.x, _q.y, _q.z, _q.w);

// Sand trap: visual + slow-down region

// Water pond / goo pool (hazards). `pit: true` means there is no floor under it.
function buildLiquid(p, ctx, kind) {
  const y = p.y ?? 0;
  const mat = kind === 'goo' ? ctx.mats.goo : ctx.mats.water;
  const m = new THREE.Mesh(flatShapeGeometry(regionShape(p.shape), y + (p.pit ? 0 : 0.012), 48), mat);
  m.receiveShadow = true; ctx.group.add(m);
  if (p.shape.r !== undefined && !p.pit) {
    // ring of pebbles around round pools
    const count = Math.round(p.shape.r * TAU / 0.32);
    const rock = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.13, 0), ctx.mats.pebble, count);
    const rng = mulberry32(Math.round(p.shape.x * 100 + p.shape.z * 7));
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new V3();
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU, rr = p.shape.r + 0.02;
      Q.setFromEuler(new THREE.Euler(rng() * 3, rng() * 3, rng() * 3));
      const s = 0.7 + rng() * 0.6; S.set(s, s * 0.55, s);
      M.compose(new V3(p.shape.x + Math.cos(a) * rr, y + 0.02, p.shape.z + Math.sin(a) * rr), Q, S);
      rock.setMatrixAt(i, M);
    }
    rock.receiveShadow = true; ctx.group.add(rock);
  }
  const R = CONFIG.BALL_RADIUS;
  const hz = { kind, region: makeRegion(p.shape), yTrig: y + R + (p.pit ? 0.02 : 0.15), surfaceY: y + (p.pit ? 0 : 0.012) };
  ctx.hazards.push(hz);
  if (kind === 'goo') {
    // glowing bubbles popping on the surface
    const b = p.shape.r !== undefined ? { minX: p.shape.x - p.shape.r, maxX: p.shape.x + p.shape.r, minZ: p.shape.z - p.shape.r, maxZ: p.shape.z + p.shape.r } : polyBounds(rectPts(p.shape));
    const col = new THREE.Color('#b6ff5a');
    let acc = 0;
    ctx.updaters.push((t, dt) => {
      acc += dt;
      const rate = 0.12 / Math.max(1, ((b.maxX - b.minX) * (b.maxZ - b.minZ)) / 6);
      while (acc > rate) {
        acc -= rate;
        const x = lerp(b.minX, b.maxX, Math.random()), z = lerp(b.minZ, b.maxZ, Math.random());
        if (hz.region.contains(x, z)) glowFX.spawn(x, hz.surfaceY + 0.02, z, 0, 0.35 + Math.random() * 0.3, 0, col, 0.1 + Math.random() * 0.12, 0.6 + Math.random() * 0.5, 0, 0, 0.6, 0.8);
      }
    });
  }
}
BUILDERS.water = (p, ctx) => buildLiquid(p, ctx, 'water');
BUILDERS.goo = (p, ctx) => buildLiquid(p, ctx, 'goo');

// Boost pad: animated chevrons; pushes the ball along the pad direction
const BOOST_VS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
BUILDERS.boost = (p, ctx) => {
  const y = p.y ?? 0, w = p.w ?? 1.3, l = p.l ?? 1.8, yaw = p.yaw ?? 0;
  const base = new THREE.Mesh(new RoundedBoxGeometry(w + 0.16, 0.024, l + 0.16, 2, 0.01), new THREE.MeshStandardMaterial({ color: '#1d2433', roughness: 0.6 }));
  base.position.set(p.x, y + 0.004, p.z); base.rotation.y = yaw; base.receiveShadow = true;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: SHARED.time, uCol: { value: new THREE.Color(p.color || ctx.theme.boostColor) } },
    vertexShader: BOOST_VS,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform vec3 uCol; varying vec2 vUv;
      void main() {
        float x = abs(vUv.x - 0.5) * 2.0;
        float s = fract(vUv.y * 2.6 - uTime * 1.8 + x * 0.45);
        float chev = smoothstep(0.0, 0.07, s) * (1.0 - smoothstep(0.3, 0.38, s)) * step(x, 0.8);
        vec3 col = mix(vec3(0.05, 0.07, 0.12), uCol * 1.9, chev);
        float edge = smoothstep(0.86, 0.93, max(x, abs(vUv.y - 0.5) * 2.0));
        col = mix(col, uCol * 1.3, edge);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const top = new THREE.Mesh(new THREE.PlaneGeometry(w, l).rotateX(-Math.PI / 2), mat);
  top.position.set(p.x, y + 0.018, p.z); top.rotation.y = yaw;
  ctx.group.add(base, top);
  ctx.boosts.push({ region: makeRegion({ x: p.x, z: p.z, w, d: l, yaw }), dir: fwdFromYaw(yaw), y, x: p.x, z: p.z, speed: p.speed ?? CONFIG.BOOST_SPEED });
  const sparkCol = new THREE.Color(p.color || ctx.theme.boostColor).multiplyScalar(1.5), dir = fwdFromYaw(yaw);
  let sAcc = 0;
  ctx.updaters.push((t, dt) => {
    sAcc += dt;
    while (sAcc > 0.09) {
      sAcc -= 0.09;
      const a = (Math.random() - 0.5) * w * 0.8, b = (Math.random() - 0.5) * l * 0.8;
      glowFX.spawn(p.x - dir.z * a + dir.x * b, y + 0.05, p.z + dir.x * a + dir.z * b, dir.x * 1.2, 0.5 + Math.random() * 0.6, dir.z * 1.2, sparkCol, 0.06 + Math.random() * 0.05, 0.5, 0, 0.5);
    }
  });
};

// Mushroom bumper: super bouncy stem, glowing spotted cap
function buildMushroomVisual(r, capCol, glowCol, emissive = 0.9) {
  const g = new THREE.Group();
  const stemMat = new THREE.MeshStandardMaterial({ color: '#fff3e0', emissive: '#ffd9f0', emissiveIntensity: 0.25, roughness: 0.6 });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.86, r, 0.62, 20), stemMat);
  stem.position.y = 0.31; stem.castShadow = true;
  const capMat = new THREE.MeshStandardMaterial({ color: capCol, emissive: capCol, emissiveIntensity: emissive, roughness: 0.4, side: THREE.DoubleSide });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(r * 1.8, 28, 12, 0, TAU, 0, Math.PI / 2), capMat);
  cap.scale.y = 0.7; cap.position.y = 0.56; cap.castShadow = true;
  const gill = new THREE.Mesh(new THREE.CircleGeometry(r * 1.78, 28).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#ffe9c9', emissive: '#ffb3d9', emissiveIntensity: 0.35 }));
  gill.position.y = 0.561;
  const spotMat = new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.6, roughness: 0.5 });
  // white spots, merged into a single mesh
  const R = r * 1.8, spotParts = [];
  for (let i = 0; i < 8; i++) {
    const th = i < 1 ? 0 : 0.55 + (i % 2) * 0.35, ph = (i / 7) * TAU + i;
    const n = new V3(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
    const sg = new THREE.SphereGeometry(r * 0.26, 10, 6);
    sg.scale(1, 0.35, 1);
    sg.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), new V3(n.x, n.y * 0.7, n.z).normalize()));
    sg.translate(n.x * R, 0.56 + n.y * R * 0.7, n.z * R);
    spotParts.push(sg);
  }
  g.add(new THREE.Mesh(mergeAll(spotParts), spotMat));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.05, 0.05, 8, 32).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(glowCol).multiplyScalar(2.2) }));
  ring.position.y = 0.06;
  g.add(stem, cap, gill, ring);
  g.userData.cap = cap; g.userData.capMat = capMat;
  return g;
}
BUILDERS.bumper = (p, ctx) => {
  const y = p.y ?? 0, r = p.r ?? 0.5;
  const vis = buildMushroomVisual(r, p.color || '#ff2b4a', ctx.theme.railGlow || '#ff4fd8');
  vis.position.set(p.x, y, p.z); ctx.group.add(vis);
  vis.traverse(o => { if (o.isMesh) ctx.camBlockers.push(o); });
  const body = makeBody('bumper', { mat: PMAT.bumper });
  body.addShape(new CANNON.Cylinder(r * 0.95, r * 0.95, 1.3, 16), new CANNON.Vec3(0, 0.35, 0));
  body.position.set(p.x, y, p.z);
  ctx.addBody(body);
  ctx.bumpers.push({ body, vis, hit: 0, x: p.x, z: p.z });
  addFootprint(ctx, { minX: p.x - r * 2, maxX: p.x + r * 2, minZ: p.z - r * 2, maxZ: p.z + r * 2 }, 0);
};

// Windmill: house with a tunnel; kinematic blades sweep across the entrance (entrance faces +Z)
BUILDERS.windmill = (p, ctx) => {
  const y = p.y ?? 0, w = p.w, dp = p.depth, tw = p.tunnelW, th = p.tunnelH, H = p.h ?? 2.2;
  // blades sit far enough in front of the door frame that a ball can never be pinched between them
  const L = p.bladeLen ?? 2.3, r0 = 0.18, hubY = r0 + L + 0.12, hubZ = dp / 2 + 0.67;
  const g = new THREE.Group(); g.position.set(p.x, y, p.z); ctx.group.add(g);
  const mk = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, transparent: true, ...extra });
  const plaster = mk('#fbf3e6'), wood = mk('#9a5b34'), roof = mk('#e5483f'), dark = mk('#3a2a40');
  const fadeMats = [plaster, wood, roof, dark];
  const sideW = (w - tw) / 2;
  const blocks = [
    [-(tw / 2 + sideW / 2), H / 2, sideW, H],
    [tw / 2 + sideW / 2, H / 2, sideW, H],
    [0, th + (H - th) / 2, tw + 0.02, H - th],
  ];
  const body = makeBody('wall');
  const houseMeshes = [];
  for (const [bx, by, bw, bh] of blocks) {
    const m = new THREE.Mesh(new RoundedBoxGeometry(bw, bh, dp, 2, 0.1), plaster);
    m.position.set(bx, by, 0); m.castShadow = m.receiveShadow = true; g.add(m); houseMeshes.push(m);
    addBox(body, bw / 2, (bh + 0.3) / 2, dp / 2, new V3(bx, by - 0.15, 0));
  }
  // wooden door frame around the tunnel mouth (front and back) — part of the collider too
  for (const zf of [dp / 2 + 0.05, -dp / 2 - 0.05]) {
    for (const sx of [-1, 1]) {
      const post = new THREE.Mesh(new RoundedBoxGeometry(0.16, th + 0.16, 0.12, 1, 0.04), wood);
      post.position.set(sx * (tw / 2 + 0.08), (th + 0.16) / 2, zf); post.castShadow = true; g.add(post); houseMeshes.push(post);
      addBox(body, 0.09, (th + 0.5) / 2, 0.07, new V3(sx * (tw / 2 + 0.08), (th + 0.5) / 2 - 0.3, zf));
    }
    const lintel = new THREE.Mesh(new RoundedBoxGeometry(tw + 0.5, 0.16, 0.12, 1, 0.04), wood);
    lintel.position.set(0, th + 0.08, zf); g.add(lintel); houseMeshes.push(lintel);
  }
  // timber beams on the facade
  for (const sx of [-1, 1]) {
    const beam = new THREE.Mesh(new RoundedBoxGeometry(0.12, H, 0.06, 1, 0.03), wood);
    beam.position.set(sx * (w / 2 - 0.25), H / 2, dp / 2 + 0.02); g.add(beam); houseMeshes.push(beam);
  }
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.45, 2.7, 8), plaster);
  tower.position.set(0, H + 1.35, -0.1); tower.castShadow = true; g.add(tower); houseMeshes.push(tower);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.4, 1.6, 8), roof);
  cone.position.set(0, H + 2.7 + 0.8, -0.1); cone.castShadow = true; g.add(cone); houseMeshes.push(cone);
  const roofHouse = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 1.0, 0.7, 4, 1), roof);
  roofHouse.rotation.y = Math.PI / 4; roofHouse.scale.set((w + 0.4) / 1.414, 1, (dp + 0.4) / 1.414);
  roofHouse.position.set(0, H + 0.3, 0); roofHouse.castShadow = true; g.add(roofHouse); houseMeshes.push(roofHouse);
  for (const wy of [H + 0.9, H + 1.9]) {
    const win = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.5, 0.1, 1, 0.06), dark);
    win.position.set(0, wy, 1.2 - (wy - H) * 0.17); win.rotation.x = -0.16; g.add(win); houseMeshes.push(win);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.75, 14).rotateX(Math.PI / 2), wood);
  hub.position.set(0, hubY, hubZ - 0.32); g.add(hub); houseMeshes.push(hub);
  body.position.set(p.x, y, p.z);
  ctx.addBody(body);

  // blades: one kinematic body, four box shapes, driven by angularVelocity
  const blades = makeBody('blade', { type: CANNON.Body.KINEMATIC, group: GROUP.OBST });
  const bladeVis = new THREE.Group();
  const sailMat = new THREE.MeshStandardMaterial({ color: '#fff8ef', roughness: 0.7 });
  const stripeMat = new THREE.MeshStandardMaterial({ color: '#e5483f', roughness: 0.7 });
  const sparMat = new THREE.MeshStandardMaterial({ color: '#7a4526', roughness: 0.8 });
  for (let k = 0; k < 4; k++) {
    const th0 = (k * Math.PI) / 2;
    const dir = new V3(Math.cos(th0), Math.sin(th0), 0);
    const off = dir.clone().multiplyScalar(r0 + L / 2);
    const q = new THREE.Quaternion().setFromAxisAngle(new V3(0, 0, 1), th0 - Math.PI / 2);
    blades.addShape(new CANNON.Box(new CANNON.Vec3(0.17, L / 2, 0.1)), new CANNON.Vec3(off.x, off.y, off.z), new CANNON.Quaternion(q.x, q.y, q.z, q.w));
    const arm = new THREE.Group(); arm.position.copy(off); arm.quaternion.copy(q);
    const spar = new THREE.Mesh(new THREE.BoxGeometry(0.08, L, 0.08), sparMat);
    const sail = new THREE.Mesh(new THREE.BoxGeometry(0.32, L - 0.25, 0.05), k % 2 ? sailMat : stripeMat);
    sail.position.set(0, 0.12, 0.03);
    for (let j = 0; j < 5; j++) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.035, 0.07), sparMat);
      bar.position.set(0, -L / 2 + 0.3 + j * ((L - 0.4) / 4), 0.05); arm.add(bar);
    }
    spar.castShadow = sail.castShadow = true;
    arm.add(spar, sail); bladeVis.add(arm);
  }
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10), stripeMat); cap.position.z = 0.05; bladeVis.add(cap);
  const hubWorld = new V3(p.x, y + hubY, p.z + hubZ);
  blades.position.set(hubWorld.x, hubWorld.y, hubWorld.z);
  const omega = p.speed ?? 1.3;
  blades.angularVelocity.set(0, 0, omega);
  ctx.addBody(blades);
  ctx.group.add(bladeVis);
  ctx.kinematics.push({
    body: blades, vis: bladeVis,
    reset(t) { const q = new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), omega * t); blades.quaternion.copy(q); blades.angularVelocity.set(0, 0, omega); },
    drive() {},
  });
  ctx.camBlockers.push(...houseMeshes);
  ctx.fades.push({ region: makeRegion({ x: p.x, z: p.z, w: tw + 0.6, d: dp + 1.4 }), mats: fadeMats, meshes: houseMeshes, amount: 1 });
  addFootprint(ctx, { minX: p.x - w / 2, maxX: p.x + w / 2, minZ: p.z - dp / 2, maxZ: p.z + dp / 2 }, 0.2);
  trackY(ctx, y + H + 4.4);
};

// Spinning bar around a central post (kinematic, angularVelocity about Y)
BUILDERS.spinner = (p, ctx) => {
  const y = p.y ?? 0, len = p.len ?? 4.2, omega = p.speed ?? 1.5;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.75, 16), new THREE.MeshStandardMaterial({ color: '#2b2140', roughness: 0.5 }));
  post.position.set(p.x, y + 0.375, p.z); post.castShadow = true;
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(ctx.theme.accent).multiplyScalar(2.4) }));
  glow.position.set(p.x, y + 0.8, p.z);
  ctx.group.add(post, glow);
  const hubBody = makeBody('wall');
  hubBody.addShape(new CANNON.Cylinder(0.24, 0.24, 1.3, 14), new CANNON.Vec3(0, 0.35, 0));
  hubBody.position.set(p.x, y, p.z); ctx.addBody(hubBody);
  const bar = makeBody('spinner', { type: CANNON.Body.KINEMATIC, group: GROUP.OBST });
  bar.addShape(new CANNON.Box(new CANNON.Vec3(len / 2, 0.24, 0.13)));
  bar.position.set(p.x, y + 0.26, p.z);
  bar.angularVelocity.set(0, omega, 0);
  ctx.addBody(bar);
  const vis = new THREE.Group();
  const barGeo = tintByNormal(new RoundedBoxGeometry(len, 0.34, 0.2, 2, 0.08), ctx.theme.rail.top, ctx.theme.rail.side);
  const barMesh = new THREE.Mesh(barGeo, ctx.mats.rail); barMesh.position.y = -0.04; barMesh.castShadow = true;
  const stripeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(ctx.theme.accent).multiplyScalar(1.4) });
  for (const sx of [-1, 1]) {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.36, 0.22), stripeMat);
    tip.position.set(sx * (len / 2 - 0.2), -0.04, 0); vis.add(tip);
  }
  vis.add(barMesh);
  ctx.group.add(vis);
  ctx.kinematics.push({
    body: bar, vis,
    reset(t) { const q = new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), omega * t); bar.quaternion.copy(q); bar.angularVelocity.set(0, omega, 0); },
    drive() {},
  });
};

// Drifting raft: kinematic platform sliding along X; driven by velocity so it carries the ball
BUILDERS.raft = (p, ctx) => {
  const y = p.y ?? 0, w = p.w ?? 2.2, l = p.l ?? 4.9, amp = p.amp ?? 3.4, period = p.period ?? 6.5, phase = p.phase ?? 0;
  const body = makeBody('raft', { type: CANNON.Body.KINEMATIC, mat: PMAT.platform, group: GROUP.OBST });
  body.addShape(new CANNON.Box(new CANNON.Vec3(w / 2, 0.25, l / 2)));
  const target = t => p.x + amp * Math.sin((TAU * t) / period + phase);
  const vel = t => amp * (TAU / period) * Math.cos((TAU * t) / period + phase);
  body.position.set(target(0), y - 0.25, p.z);
  ctx.addBody(body);
  const vis = new THREE.Group();
  const deckMat = new THREE.MeshStandardMaterial({ map: TEX.planks, color: '#ffffff', roughness: 0.85 });
  const deckGeo = new THREE.BoxGeometry(w, 0.16, l);
  // planks run across the direction of travel
  const uv = deckGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w * 0.5, uv.getY(i) * l * 0.5);
  const deck = new THREE.Mesh(deckGeo, deckMat); deck.position.y = 0.17; deck.receiveShadow = deck.castShadow = true;
  const logMat = new THREE.MeshStandardMaterial({ color: '#8a5432', roughness: 0.9 });
  for (let i = 0; i < 4; i++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, l + 0.2, 10).rotateX(Math.PI / 2), logMat);
    log.position.set(-w / 2 + 0.28 + i * ((w - 0.56) / 3), -0.05, 0); log.castShadow = true; vis.add(log);
  }
  for (const sz of [-1, 1]) {
    const buoy = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), new THREE.MeshStandardMaterial({ color: '#ff6b3d', roughness: 0.5 }));
    buoy.position.set(w / 2 - 0.05, 0.05, sz * (l / 2 - 0.3)); vis.add(buoy);
  }
  vis.add(deck);
  ctx.group.add(vis);
  ctx.kinematics.push({
    body, vis, visOffsetY: 0,
    reset(t) { body.position.x = target(t); body.velocity.set(vel(t), 0, 0); },
    drive(t, dt) { body.velocity.set((target(t + dt) - body.position.x) / dt, 0, 0); },
  });
  addFootprint(ctx, { minX: p.x - amp - w / 2, maxX: p.x + amp + w / 2, minZ: p.z - l / 2, maxZ: p.z + l / 2 }, 0);
};

// Teleporter pair: entering one sends the ball out of the other, along that portal's direction
const PORTAL_FS = /* glsl */`
  uniform float uTime; uniform vec3 uCol; varying vec2 vUv;
  void main() {
    vec2 c = vUv - 0.5; float r = length(c) * 2.0; float a = atan(c.y, c.x);
    float swirl = sin(a * 3.0 + r * 9.0 - uTime * 5.0) * 0.5 + 0.5;
    float alpha = smoothstep(1.0, 0.75, r) * (0.35 + 0.65 * swirl) * (0.5 + 0.5 * r);
    gl_FragColor = vec4(uCol * (1.2 + swirl), alpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;
BUILDERS.teleporter = (p, ctx) => {
  const col = new THREE.Color(p.color || ctx.theme.accent);
  const ends = [p.a, p.b].map(e => ({ pos: new V3(e.x, e.y ?? 0, e.z), yaw: e.yaw, dir: fwdFromYaw(e.yaw), r: 0.5 }));
  ends[0].other = ends[1]; ends[1].other = ends[0];
  const legBody = makeBody('wall');
  for (const e of ends) {
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.56, 40).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
      uniforms: { uTime: SHARED.time, uCol: { value: col } }, vertexShader: BOOST_VS, fragmentShader: PORTAL_FS,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    disc.position.copy(e.pos).y += 0.02;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.06, 10, 40).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.5) }));
    ring.position.copy(e.pos).y += 0.03;
    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.07, 10, 32, Math.PI), new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.3) }));
    arch.position.copy(e.pos); arch.rotation.y = e.yaw;
    // exit arrow on the floor
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 3).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(2.2) }));
    arrow.scale.y = 0.2;
    arrow.position.copy(e.pos).addScaledVector(e.dir, 0.82).y += 0.03; arrow.rotation.y = e.yaw;
    ctx.group.add(disc, ring, arch, arrow);
    // the arch's feet are solid
    const side = new V3(-e.dir.z, 0, e.dir.x);
    for (const s of [-1, 1]) legBody.addShape(new CANNON.Cylinder(0.09, 0.09, 1.3, 8), new CANNON.Vec3(e.pos.x + side.x * 0.82 * s, e.pos.y + 0.35, e.pos.z + side.z * 0.82 * s));
    const spin = arch;
    ctx.updaters.push(t => { spin.scale.setScalar(1 + Math.sin(t * 4 + e.pos.x) * 0.03); });
    ctx.portals.push(e);
  }
  ctx.addBody(legBody);
};

// Covered tunnel over a corridor (roof collider, fades when the ball is inside)
BUILDERS.tunnel = (p, ctx) => {
  const y = p.y ?? 0, w = p.w, d = p.d, yaw = p.yaw ?? 0, h = p.h ?? 1.0;
  const g = new THREE.Group(); g.position.set(p.x, y, p.z); g.rotation.y = yaw; ctx.group.add(g);
  const shellMat = new THREE.MeshStandardMaterial({ color: ctx.theme.tunnelColor || '#3b2a5c', roughness: 0.6, side: THREE.DoubleSide, transparent: true });
  const ribMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(ctx.theme.accent).multiplyScalar(2.2), transparent: true });
  const rad = w / 2 + CONFIG.RAIL_THICK;
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, d, 28, 1, true, -Math.PI / 2, Math.PI), shellMat);
  shell.rotation.x = -Math.PI / 2;   // axis along local Z, open half facing up
  shell.scale.set(1, 1, h / rad);
  shell.position.y = CONFIG.RAIL_HEIGHT; shell.castShadow = true;
  g.add(shell);
  const ribs = Math.max(2, Math.round(d / 1.1));
  for (let i = 0; i <= ribs; i++) {
    const rib = new THREE.Mesh(new THREE.TorusGeometry(rad + 0.02, 0.06, 8, 28, Math.PI), ribMat);
    rib.scale.set(1, h / rad, 1);
    rib.position.set(0, CONFIG.RAIL_HEIGHT, -d / 2 + (i / ribs) * d);
    g.add(rib);
  }
  const body = makeBody('wall');
  _q.setFromEuler(new THREE.Euler(0, yaw, 0));
  addBox(body, rad, 0.2, d / 2, new V3(0, CONFIG.RAIL_HEIGHT + h + 0.25, 0));
  body.position.set(p.x, y, p.z); body.quaternion.set(_q.x, _q.y, _q.z, _q.w);
  ctx.addBody(body);
  ctx.fades.push({ region: makeRegion({ x: p.x, z: p.z, w: w + 0.4, d: d + 0.8, yaw }), mats: [shellMat, ribMat], amount: 0.8 });
  trackY(ctx, y + h + 1);
};

// Decorative set pieces (no gameplay)
BUILDERS.deco = (p, ctx) => {
  if (p.kind === 'shipwreck') {
    const g = new THREE.Group();
    const wood = new THREE.MeshStandardMaterial({ color: '#6b4a3a', roughness: 0.95 });
    const dark = new THREE.MeshStandardMaterial({ color: '#3d2a24', roughness: 1 });
    const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 7, 16, 1, true, Math.PI * 0.5, Math.PI), wood);
    hull.rotation.z = Math.PI / 2; hull.scale.set(1, 1, 0.75); hull.material.side = THREE.DoubleSide;
    hull.position.y = 1.5; g.add(hull);
    for (let i = 0; i < 7; i++) {
      const rib = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.09, 6, 12, Math.PI), dark);
      rib.rotation.y = Math.PI / 2; rib.rotation.z = Math.PI; rib.scale.set(0.75, 1, 1);
      rib.position.set(-3 + i, 1.5, 0); g.add(rib);
    }
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 7, 8), dark);
    mast.position.set(0.5, 4.2, 0); mast.rotation.z = 0.35; g.add(mast);
    const sail = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.4, 6, 6), new THREE.MeshStandardMaterial({ color: '#e8dcc0', side: THREE.DoubleSide, roughness: 1 }));
    sail.position.set(1.2, 5.2, 0.05); sail.rotation.z = 0.35;
    const sp = sail.geometry.attributes.position;
    for (let i = 0; i < sp.count; i++) sp.setZ(i, Math.sin(sp.getX(i) * 2) * 0.15 + (Math.random() - 0.5) * 0.08);
    sail.geometry.computeVertexNormals();
    g.add(sail);
    const chest = new THREE.Mesh(new RoundedBoxGeometry(0.8, 0.55, 0.55, 2, 0.06), new THREE.MeshStandardMaterial({ color: '#c98a2b', emissive: '#ffcc33', emissiveIntensity: 0.25 }));
    chest.position.set(-3.2, 0.3, 1.6); chest.rotation.y = 0.5; g.add(chest);
    g.traverse(o => { if (o.isMesh) o.castShadow = false; });
    g.position.set(p.x, ctx.theme.groundY, p.z); g.rotation.set(0.12, p.yaw || 0, -0.18);
    g.scale.setScalar(p.scale || 1);
    ctx.group.add(g);
  }
};

/* ---------- Tee, cup and hole sign (built from hole data) ---------- */
function buildTee(ctx, tee) {
  const mat = new THREE.MeshStandardMaterial({ color: ctx.theme.teeMat || '#2f6b4a', roughness: 0.9 });
  const m = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.02, 0.95, 3, 0.01), mat);
  m.position.set(tee[0], tee[1] + 0.004, tee[2]); m.receiveShadow = true;
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.09, 20).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  dot.position.set(tee[0], tee[1] + 0.016, tee[2]);
  ctx.group.add(m, dot);
}

const PILLAR_FS = /* glsl */`
  uniform vec3 uCol; uniform float uTime, uAlpha; varying vec2 vUv; varying vec3 vN; varying vec3 vView;
  void main() {
    float f = abs(dot(normalize(vN), normalize(vView)));
    float a = pow(f, 1.6) * pow(1.0 - vUv.y, 1.5) * uAlpha;
    a *= 0.8 + 0.2 * sin(vUv.y * 40.0 - uTime * 4.0);
    gl_FragColor = vec4(uCol, a);
  }`;
const PILLAR_VS = /* glsl */`
  varying vec2 vUv; varying vec3 vN; varying vec3 vView;
  void main() { vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalMatrix * normal; vView = -mv.xyz; gl_Position = projectionMatrix * mv; }`;

function buildCup(ctx, cupPos, holeNum) {
  const R = CONFIG.CUP_RADIUS, depth = 0.55;
  const g = new THREE.Group(); g.position.set(cupPos[0], cupPos[1], cupPos[2]); ctx.group.add(g);
  // 1) invisible mask disc writes stencil=1 where the hole opening is visible
  const mask = new THREE.Mesh(new THREE.CircleGeometry(R, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({
    colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc,
    stencilZPass: THREE.ReplaceStencilOp, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  }));
  mask.position.y = 0.002; mask.renderOrder = 1;
  // 2) interior wall + bottom drawn only through the opening
  const stencilEq = { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc };
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(R, R, depth, 36, 1, true), new THREE.MeshBasicMaterial({
    map: TEX.cupWall, side: THREE.BackSide, depthFunc: THREE.AlwaysDepth, ...stencilEq,
  }));
  wall.position.y = -depth / 2; wall.renderOrder = 2;
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(R, 36).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#050505', ...stencilEq }));
  bottom.position.y = -depth; bottom.renderOrder = 3;
  // 3) white rim
  const rim = new THREE.Mesh(new THREE.RingGeometry(R, R + 0.07, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({
    color: '#ffffff', roughness: 0.4, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  }));
  rim.position.y = 0.003; rim.receiveShadow = true;
  // flag on a pole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.95, 8), new THREE.MeshStandardMaterial({ color: '#f4f4f4', roughness: 0.4 }));
  pole.position.y = 1.95 / 2 - 0.25; pole.castShadow = true;
  const flagTex = textTexture(String(holeNum), {
    w: 256, h: 160, size: 112, strokeW: 14,
    bg: (c, w, h) => { c.fillStyle = ctx.theme.flag; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(0, h * 0.78, w, h * 0.22); },
  });
  const flagMat = new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: 0.8 });
  flagMat.onBeforeCompile = shader => {
    shader.uniforms.uTime = SHARED.time;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float fx = clamp(position.x / 0.64, 0.0, 1.0);
        transformed.z += sin(position.x * 7.0 - uTime * 6.0) * 0.07 * fx;
        transformed.y += sin(position.x * 5.0 - uTime * 4.0) * 0.02 * fx;`);
  };
  flagMat.customProgramCacheKey = () => 'flag-v1';
  const flagGeo = new THREE.PlaneGeometry(0.64, 0.4, 14, 3); flagGeo.translate(0.32, 0, 0);
  const flag = new THREE.Mesh(flagGeo, flagMat); flag.position.y = 1.47; flag.castShadow = true;
  // glowing light pillar, visible from the tee
  const pillarMat = new THREE.ShaderMaterial({
    uniforms: { uCol: { value: new THREE.Color(ctx.theme.pillar) }, uTime: SHARED.time, uAlpha: { value: 0.4 } },
    vertexShader: PILLAR_VS, fragmentShader: PILLAR_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const pillarGeo = new THREE.CylinderGeometry(0.34, 0.34, 16, 28, 1, true); pillarGeo.translate(0, 8, 0);
  const pillar = new THREE.Mesh(pillarGeo, pillarMat); pillar.renderOrder = 5;
  g.add(mask, wall, bottom, rim, pole, flag, pillar);
  ctx.cup = { pos: new V3(cupPos[0], cupPos[1], cupPos[2]), group: g, flag, pole, pillarMat };
}

function buildSign(ctx, sign, holeNum) {
  const [x, z, yaw] = sign;
  const y = ctx.signY ?? 0;
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yaw; ctx.group.add(g);
  const woodMat = new THREE.MeshStandardMaterial({ color: ctx.theme.signWood || '#8a5a3c', roughness: 0.9 });
  const postLen = y + 1.9 - ctx.theme.groundY;
  const post = new THREE.Mesh(new RoundedBoxGeometry(0.16, postLen, 0.16, 1, 0.04), woodMat);
  post.position.y = ctx.theme.groundY + postLen / 2; post.castShadow = true;
  const board = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.82, 0.14, 2, 0.06), new THREE.MeshStandardMaterial({ color: ctx.theme.signBoard || '#5e5560', roughness: 0.85 }));
  board.position.set(0, y + 1.55, 0.06); board.castShadow = true;
  const tex = textTexture(`Hole ${holeNum}`, { w: 512, h: 256, size: 118, color: ctx.theme.signText || '#ffffff', stroke: 'rgba(30,20,30,0.55)', strokeW: 10 });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.68), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.9, emissive: '#ffffff', emissiveMap: tex, emissiveIntensity: ctx.theme.signGlow || 0.08 }));
  face.position.set(0, y + 1.55, 0.135);
  g.add(post, board, face);
  // fade the sign out when the camera passes close by, so it never blocks the view
  const mats = [woodMat, board.material, face.material];
  mats.forEach(m => { m.transparent = true; });
  ctx.updaters.push(() => {
    const d = Math.hypot(camera.position.x - x, camera.position.z - z);
    const o = clamp((d - 2.2) / 2.5, 0, 1);
    for (const m of mats) { m.opacity = o; m.depthWrite = o > 0.98; }
    g.visible = o > 0.01;
  });
}

function makeBranchCoralGeo(rng) {

      const k = 2 + Math.floor(rng() * 2);

        const d = dir.clone().add(new V3((rng() - 0.5) * 1.4, 0.3 + rng() * 0.3, (rng() - 0.5) * 1.4)).normalize();
        add(tip, d, len * (0.6 + rng() * 0.2), rad * 0.7, depth - 1);
      }
    } else {
      const s = new THREE.SphereGeometry(rad * 1.1, 6, 4); s.translate(tip.x, tip.y, tip.z); parts.push(s);
    }
  };

  const g = mergeGeometries(parts.map(p => p.toNonIndexed()));
  parts.forEach(p => p.dispose());

}

    const g = new THREE.CylinderGeometry(r, r * 0.8, h, 8, 1, true); g.translate((rng() - 0.5) * 0.5, h / 2, (rng() - 0.5) * 0.5);

  }

}
function makeBrainCoralGeo() {
  const g = new THREE.IcosahedronGeometry(0.8, 3);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + 0.07 * Math.sin(x * 9 + Math.sin(z * 7) * 2) * Math.cos(z * 8 + y * 5);

}

  const tail = new THREE.ConeGeometry(0.28, 0.4, 4); tail.rotateZ(Math.PI / 2); tail.scale(1, 1, 0.25); tail.translate(-0.6, 0, 0);
  const fin = new THREE.ConeGeometry(0.12, 0.3, 3); fin.rotateZ(-0.4); fin.scale(1, 1, 0.2); fin.translate(0, 0.3, 0);
  const g = mergeGeometries([body.toNonIndexed(), tail.toNonIndexed(), fin.toNonIndexed()]);

}

  const stems = [], caps = [], spots = [];
  for (const p of scatter(ctx, rng, Math.round(20 * density), 6, 42, 6)) {
    const h = 3 + rng() * 6, cr = 1.4 + h * 0.28, tilt = (rng() - 0.5) * 0.2, ry = rng() * TAU;
    stems.push(mat4(p.x, gy, p.z, 0.6 + h * 0.06, h, 0.6 + h * 0.06, ry, tilt));
    caps.push(mat4(p.x, gy + h, p.z, cr, cr * 0.62, cr, ry, tilt));
    for (let k = 0; k < 10; k++) {
      const th = 0.25 + rng() * 1.0, ph = rng() * TAU;
      const n = new V3(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
      const pos = new V3(p.x + n.x * cr, gy + h + n.y * cr * 0.62, p.z + n.z * cr);
      const q = new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), new V3(n.x, n.y * 0.62, n.z).normalize());
      const s = cr * (0.1 + rng() * 0.07);

    }
  }

  instanced(ctx, new THREE.SphereGeometry(1, 24, 12, 0, TAU, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#ff2b4a', emissive: '#ff1f3d', emissiveIntensity: 0.9, roughness: 0.45, side: THREE.DoubleSide }), caps, { shadow: true, block: true });
  instanced(ctx, new THREE.SphereGeometry(1, 10, 6), new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.7 }), spots);
  // small glowing mushrooms near the course
  const sm = [], smC = [], smStem = [];
  const smCols = ['#ff4fd8', '#3ff7ff', '#a66bff', '#ff6a3d'].map(c => new THREE.Color(c).multiplyScalar(1.8));
  for (const p of scatter(ctx, rng, Math.round(60 * density), 0.6, 9, 0.5)) {

  instanced(ctx, stemGeo, new THREE.MeshStandardMaterial({ color: '#e6d8ff', emissive: '#bfa0ff', emissiveIntensity: 0.4 }), smStem);
  instanced(ctx, new THREE.SphereGeometry(1, 14, 8, 0, TAU, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#ffffff' }), sm, { colors: smC });
  // glowing plants (swaying fronds with bulbs)
  const fr = [], frC = [], bulbs = [], bulbC = [];
  const pc = ['#3ff7ff', '#a6ff3f', '#ff4fd8', '#ffe14d'].map(c => new THREE.Color(c));
  for (const p of scatter(ctx, rng, Math.round(80 * density), 0.5, 16, 0.4)) {
    const col = pick(rng, pc), n = 3 + Math.floor(rng() * 3);
    for (let k = 0; k < n; k++) {

      fr.push(mat4(p.x, gy, p.z, 1, h, 1, 0, rx, rz)); frC.push(col.clone().multiplyScalar(1.3));
      const tip = new V3(0, h, 0).applyEuler(new THREE.Euler(rx, 0, rz));
      bulbs.push(mat4(p.x + tip.x, gy + tip.y, p.z + tip.z, 1, 1, 1)); bulbC.push(col.clone().multiplyScalar(2.4));

  instanced(ctx, frGeo, addSway(new THREE.MeshBasicMaterial({ color: '#ffffff' }), 0.05, 1.7), fr, { colors: frC, receive: false });
  instanced(ctx, new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' }), bulbs, { colors: bulbC, receive: false });
  // dark forest silhouettes far away
  const trunks = [], crowns = [];
  const cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  for (let i = 0; i < 46; i++) {
    const a = rng() * TAU, d = 55 + rng() * 45, h = 10 + rng() * 14;

  }

  // fireflies
  const F = Math.round(130 * density), fpos = new Float32Array(F * 3), fseed = [];
  for (let i = 0; i < F; i++) fseed.push({ x: lerp(b.minX - 10, b.maxX + 10, rng()), z: lerp(b.minZ - 10, b.maxZ + 10, rng()), y: gy + 0.8 + rng() * 4, a: rng() * TAU, s: 0.3 + rng() * 0.6 });

  const flies = new THREE.Points(fgeo, fmat); flies.frustumCulled = false; ctx.group.add(flies);
  ctx.updaters.push(t => {
    fseed.forEach((f, i) => {
      fpos[i * 3] = f.x + Math.sin(t * f.s + f.a) * 2.2;
      fpos[i * 3 + 1] = f.y + Math.sin(t * f.s * 1.7 + f.a * 2) * 0.6;

  const moon = new THREE.Mesh(new THREE.CircleGeometry(30, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color('#f4e9ff').multiplyScalar(1.6), fog: false }));
  const halo = new THREE.Mesh(new THREE.CircleGeometry(60, 40), new THREE.MeshBasicMaterial({ map: TEX.glow, color: '#b48cff', transparent: true, opacity: 0.5, fog: false, depthWrite: false }));
  moon.renderOrder = -9; halo.renderOrder = -9.5;
  ctx.group.add(moon, halo);

    _P.set(-0.45, 0.42, -0.78).normalize().multiplyScalar(700).add(camera.position);

    moon.lookAt(camera.position); halo.lookAt(camera.position);
  });
};

    camBlockers: [], floorMeshes: [], footprint: [], noProps: [], minY: Infinity, maxY: -Infinity,
    mats: makeThemeMaterials(theme), signY: hole.tee[1],

  ctx.wallBody = makeBody('wall');

  const grassGeo = mergeAll(ctx.grassGeos);
  if (grassGeo) { const m = new THREE.Mesh(grassGeo, ctx.mats.grass); m.receiveShadow = true; ctx.group.add(m); ctx.floorMeshes.push(m); }

      if (m.uniforms) for (const u of Object.values(m.uniforms)) if (u && u.value && u.value.isTexture && !shared.has(u.value)) u.value.dispose();

  sun.position.copy(center).addScaledVector(L, 80);

  sun.updateMatrixWorld(); sun.target.updateMatrixWorld();

  cam.position.copy(sun.position); cam.lookAt(center); cam.updateMatrixWorld();

  for (const x of [b.minX - 1.5, b.maxX + 1.5]) for (const y of [ctx.minY - 0.6, ctx.maxY + 2]) for (const z of [b.minZ - 1.5, b.maxZ + 1.5]) {
    const p = new V3(x, y, z).applyMatrix4(inv);
